<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Runner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#0d0a1f;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,8,30,.86);padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto;text-align:center}
.hide{display:none}
h1{margin:0;font-size:2rem;letter-spacing:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px}
.chip{border:2px solid #4b4380;background:#1c1740;color:#fff;border-radius:12px;padding:8px 12px;font:inherit;font-size:.85rem}
.chip.sel{border-color:#38e8ff;background:#26307a}
.chip.lock{opacity:.7}
.btn{border:0;background:#ff4fa3;color:#fff;border-radius:16px;padding:14px 38px;font:inherit;font-size:1.2rem;font-weight:700}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-weight:700;font-size:1.1rem;pointer-events:none;text-shadow:0 2px 4px #000}
small{opacity:.75}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><span id="sc">0 m</span><span id="co">🪙 0</span></div>
<div id="menu" class="ov"><h1>🏃 NEON RUNNER</h1><div id="bank"></div>
<div id="shop" style="display:flex;flex-direction:column;gap:10px"></div>
<button class="btn" id="play">¡Correr!</button>
<small>Desliza ← → para cambiar de carril · ↑ saltar · ↓ deslizarte</small></div>
<div id="over" class="ov hide"><h1>¡Chocaste!</h1><div id="res"></div>
<button class="btn" id="again">Otra vez</button><button class="chip" id="home">Menú y tienda</button></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
// ---- DATOS: añade mundos, personajes o skins aquí ----
const WORLDS=[
 {n:'Ciudad Neón',sky:['#1b0b3a','#ff4fa3'],ground:'#1a1530',line:'#38e8ff',deco:'#7a3cff'},
 {n:'Desierto',sky:['#ff9f5a','#ffe7a8'],ground:'#c98a4b',line:'#fff0c9',deco:'#a8602a'},
 {n:'Mundo Hielo',sky:['#7ec8ff','#eaf8ff'],ground:'#cfeaff',line:'#ffffff',deco:'#6aa9d9'},
 {n:'Bosque',sky:['#0f3d2e','#9be37a'],ground:'#2d5a2a',line:'#e8ffd0',deco:'#1f7a3a'}];
const CHARS=[{n:'Zip',c:'#ff5a5f'},{n:'Nova',c:'#38e8ff'},{n:'Bolt',c:'#ffd23f'},{n:'Luna',c:'#b57bff'}];
const SKINS=['Banda','Rayas','Corona','Casco'];
const GRP=[['w','Mundo',WORLDS.map(w=>w.n),[0,100,200,300]],['c','Personaje',CHARS.map(c=>c.n),[0,80,150,250]],['s','Skin',SKINS,[0,60,120,200]]];
// ---- Progreso guardado ----
const KEY='neon-runner-v1';
let S={coins:0,best:0,own:{w:[0],c:[0],s:[0]},sel:{w:0,c:0,s:0}};
try{S=Object.assign(S,JSON.parse(localStorage[KEY]))}catch(e){}
const save=()=>{try{localStorage[KEY]=JSON.stringify(S)}catch(e){}};
function menu(){
 $('bank').textContent='🪙 '+S.coins+' · Récord '+S.best+' m';$('shop').innerHTML='';
 GRP.forEach(([k,t,names,costs])=>{const d=document.createElement('div');d.innerHTML='<small>'+t+'</small>';
  const r=document.createElement('div');r.className='row';
  names.forEach((n,i)=>{const own=S.own[k].includes(i),b=document.createElement('button');
   b.className='chip'+(S.sel[k]==i?' sel':'')+(own?'':' lock');b.textContent=own?n:n+' 🔒 '+costs[i];
   b.onclick=()=>{if(!own){if(S.coins<costs[i])return;S.coins-=costs[i];S.own[k].push(i)}S.sel[k]=i;save();menu()};r.appendChild(b)});
  d.appendChild(r);$('shop').appendChild(d)});
 $('menu').classList.remove('hide');$('over').classList.add('hide');$('hud').classList.add('hide')}
// ---- Juego ----
let W,H,G=null,last=0;
function resize(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d}
addEventListener('resize',resize);resize();
function start(){G={z:0,sp:14,lane:1,px:0,py:0,vy:0,slide:0,obs:[],coin:[],score:0,coins:0,t:0,next:10,dead:false};
 $('menu').classList.add('hide');$('over').classList.add('hide');$('hud').classList.remove('hide');
 last=performance.now();requestAnimationFrame(loop)}
function spawn(){const z=70,l=Math.floor(Math.random()*3),t=Math.random();
 if(t<.35)G.obs.push({z,l,k:0});
 else if(t<.62){G.obs.push({z,l,k:1});G.obs.push({z,l:(l+1)%3,k:1})}
 else if(t<.82)for(let i=0;i<3;i++)G.obs.push({z,l:i,k:2});
 const cl=(l+2)%3;for(let i=0;i<5;i++)G.coin.push({z:z+i*2,l:cl})}
function upd(dt){const g=G;g.t+=dt;g.sp=Math.min(34,14+g.t*.35);const d=g.sp*dt;g.z+=d;g.score+=d;
 g.px+=((g.lane-1)-g.px)*Math.min(1,dt*14);
 g.vy-=36*dt;g.py+=g.vy*dt;if(g.py<=0){g.py=0;g.vy=0}
 g.slide-=dt;g.next-=d;if(g.next<=0){spawn();g.next=14+Math.random()*10}
 for(const o of g.obs){o.z-=d;if(!o.hit&&o.z<.5&&o.z>-.5&&Math.abs(o.l-1-g.px)<.6){
   if((o.k==0&&g.py<.55)||o.k==1||(o.k==2&&g.slide<=0)){end();return}}}
 for(const c of g.coin){c.z-=d;if(!c.got&&c.z<.5&&c.z>-.5&&Math.abs(c.l-1-g.px)<.6){c.got=1;g.coins++}}
 g.obs=g.obs.filter(o=>o.z>-3);g.coin=g.coin.filter(c=>c.z>-3&&!c.got)}
function end(){G.dead=true;const m=Math.floor(G.score);S.coins+=G.coins;S.best=Math.max(S.best,m);save();
 $('res').textContent=m+' m · 🪙 '+G.coins+' · Récord '+S.best+' m';$('over').classList.remove('hide');$('hud').classList.add('hide')}
function draw(){
 const g=G,w=WORLDS[S.sel.w],ch=CHARS[S.sel.c],hz=H*.36,gy=H*.8,lw=W*.17;
 const P=z=>1/(1+z*.1),Y=s=>hz+(gy-hz)*s,X=(l,s)=>W/2+l*lw*s;
 const gr=x.createLinearGradient(0,0,0,hz);gr.addColorStop(0,w.sky[0]);gr.addColorStop(1,w.sky[1]);
 x.fillStyle=gr;x.fillRect(0,0,W,hz);x.fillStyle=w.ground;x.fillRect(0,hz,W,H-hz);
 x.fillStyle='rgba(0,0,0,.28)';x.beginPath();x.moveTo(W/2,hz);x.lineTo(X(1.6,1.3),Y(1.3));x.lineTo(X(-1.6,1.3),Y(1.3));x.fill();
 x.strokeStyle=w.line;x.lineWidth=4;
 for(const l of[-1.6,1.6]){x.beginPath();x.moveTo(X(l,0),hz);x.lineTo(X(l,1.3),Y(1.3));x.stroke()}
 for(const l of[-.5,.5])for(let k=0;k<20;k++){const z0=k*4-g.z%4,a=P(z0),b=P(Math.max(0,z0+2));
  x.lineWidth=3*a;x.beginPath();x.moveTo(X(l,a),Y(a));x.lineTo(X(l,b),Y(b));x.stroke()}
 for(let k=16;k>=0;k--){const z=k*5-g.z%5,s=P(z),id=Math.floor(g.z/5)+k,h=1+(id*7%4)*.7;
  for(const sd of[-1,1]){const bx=X(sd*2.9,s),bw=lw*1.1*s,bh=lw*h*1.4*s;
   x.fillStyle=w.deco;x.fillRect(bx-bw/2,Y(s)-bh,bw,bh);x.fillStyle='rgba(255,255,255,.2)';x.fillRect(bx-bw/2,Y(s)-bh,bw,bh*.08)}}
 const all=[...g.obs.map(o=>({o,t:0})),...g.coin.map(o=>({o,t:1}))].sort((a,b)=>b.o.z-a.o.z);
 for(const {o,t} of all){const s=P(Math.max(o.z,-3)),bx=X(o.l-1,s),by=Y(s),u=lw*s;
  if(t){x.fillStyle='#ffd23f';x.beginPath();x.arc(bx,by-u*(.6+.08*Math.sin(g.t*8+o.z)),u*.22,0,7);x.fill()}
  else if(o.k==0){x.fillStyle='#ff8a3d';x.fillRect(bx-u*.4,by-u*.5,u*.8,u*.5);x.fillStyle='#fff';x.fillRect(bx-u*.4,by-u*.35,u*.8,u*.1)}
  else if(o.k==1){x.fillStyle='#ff3b5c';x.fillRect(bx-u*.4,by-u*1.5,u*.8,u*1.5);x.fillStyle='rgba(255,255,255,.25)';x.fillRect(bx-u*.4,by-u*1.5,u*.8,u*.12)}
  else{x.fillStyle='#b57bff';x.fillRect(bx-u*.5,by-u*1.35,u,u*.5);x.fillStyle='#fff';x.fillRect(bx-u*.5,by-u*1.35,u,u*.08)}}
 // jugador
 const px=W/2+g.px*lw,py=gy-g.py*lw,sl=g.slide>0,bh=lw*(sl?.55:1.05),bw=lw*.5,r=Math.sin(g.t*16)*lw*.1*(g.py>0?0:1),sk=S.sel.s;
 x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.ellipse(px,gy,bw*.7,bw*.2,0,0,7);x.fill();
 x.fillStyle='#222';x.fillRect(px-bw*.4+r,py-lw*.2,bw*.3,lw*.2);x.fillRect(px+bw*.1-r,py-lw*.2,bw*.3,lw*.2);
 x.fillStyle=ch.c;x.beginPath();x.roundRect(px-bw/2,py-bh,bw,bh-lw*.15,lw*.12);x.fill();
 if(sk==1){x.fillStyle='rgba(255,255,255,.7)';for(let i=1;i<4;i++)x.fillRect(px-bw/2,py-bh+(bh-lw*.15)*i/4,bw,lw*.06)}
 const hy=py-bh-lw*.05,hr=lw*.2;x.fillStyle='#ffd9b3';x.beginPath();x.arc(px,hy,hr,0,7);x.fill();
 x.fillStyle='#222';x.fillRect(px-hr*.5,hy-hr*.1,hr*.25,hr*.3);x.fillRect(px+hr*.25,hy-hr*.1,hr*.25,hr*.3);
 if(sk==0){x.fillStyle=ch.c;x.fillRect(px-hr,hy-hr*.7,hr*2,hr*.3)}
 if(sk==2){x.fillStyle='#ffd23f';x.beginPath();x.moveTo(px-hr,hy-hr*.7);x.lineTo(px-hr*.6,hy-hr*1.8);x.lineTo(px,hy-hr);x.lineTo(px+hr*.6,hy-hr*1.8);x.lineTo(px+hr,hy-hr*.7);x.fill()}
 if(sk==3){x.fillStyle=ch.c;x.beginPath();x.arc(px,hy,hr*1.1,Math.PI,0);x.fill();x.fillStyle='#fff';x.fillRect(px-hr*1.1,hy-hr*.2,hr*2.2,hr*.15)}
 $('sc').textContent=Math.floor(g.score)+' m';$('co').textContent='🪙 '+g.coins}
function loop(ts){if(!G||G.dead)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;upd(dt);if(!G.dead)draw();requestAnimationFrame(loop)}
// ---- Controles ----
const mv=d=>{if(G&&!G.dead)G.lane=Math.max(0,Math.min(2,G.lane+d))};
const jump=()=>{if(G&&!G.dead&&G.py==0){G.vy=9.5;G.slide=0}};
const slide=()=>{if(G&&!G.dead){G.slide=.7;if(G.py>0)G.vy=-14}};
addEventListener('keydown',e=>{const k=e.key;
 if(k=='ArrowLeft'||k=='a')mv(-1);else if(k=='ArrowRight'||k=='d')mv(1);
 else if(k=='ArrowUp'||k=='w'||k==' ')jump();else if(k=='ArrowDown'||k=='s')slide()});
let t0=null;addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;t0=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
 if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else if(dy<0)jump();else slide()});
$('play').onclick=start;$('again').onclick=start;$('home').onclick=menu;menu();
</script></body></html>
